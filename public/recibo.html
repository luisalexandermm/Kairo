<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibo de pedido — kAIRO Sneakers</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="img/favicon-96.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/legal.css?v=2">
<script src="js/negocio.js"></script>
<style>
.rc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 26px;max-width:720px;margin:0 auto}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:2px solid #0e0e0e;padding-bottom:16px;margin-bottom:16px}
.rc-top img{height:46px;width:auto}
.rc-no{text-align:right}
.rc-no small{display:block;font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rc-no b{font-family:'Anton',sans-serif;font-weight:400;font-size:1.6rem;letter-spacing:.03em}
.rc-biz{font-size:.84rem;color:var(--muted);line-height:1.5}
.rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:.92rem;margin-bottom:16px}
.rc-grid dt{font-size:.76rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rc-grid dd{margin:0 0 4px;font-weight:700}
.rc table{font-size:.92rem}
.rc td.num,.rc th.num{text-align:right;white-space:nowrap}
.rc tfoot td{border-bottom:0;padding:5px 10px}
.rc tfoot tr.grand td{font-weight:800;font-size:1.05rem;border-top:2px solid #0e0e0e;padding-top:10px}
.rc .nobox{display:inline-block;font-size:.74rem;font-weight:800;background:#fff4c2;color:#4a3d00;border-radius:999px;padding:2px 8px;margin-top:3px}
.rc-st{display:inline-block;background:#0e4d38;color:#fff;font-weight:800;font-size:.82rem;border-radius:999px;padding:4px 12px}
.rc-legal{font-size:.8rem;color:var(--muted);margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.tools{max-width:720px;margin:0 auto 16px;display:flex;gap:10px;flex-wrap:wrap}
.btn--line{background:#fff;color:#0e4d38;border:1.5px solid #0e4d38}
.ask{max-width:520px;margin:0 auto}
@media(max-width:560px){.rc{padding:20px 16px}.rc-grid{grid-template-columns:1fr}.rc-no{text-align:left}}
@media print{
  body{background:#fff}.l-head,.l-foot,.tools,.skip-link{display:none!important}
  main{padding:0;max-width:none}.rc{border:0;padding:0;max-width:none}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="l-head"><div class="in"><a class="l-brand" href="/"><img src="/img/kairo-logo-blanco.png" alt="kAIRO Sneakers, ir a la tienda" width="187" height="40"></a><nav aria-label="Volver"><a href="/seguimiento.html">Seguir un pedido</a></nav></div></header>

<main id="contenido" tabindex="-1">
  <div id="out" aria-live="polite">
    <form class="ask" id="askForm" novalidate hidden>
      <h1>Recibo de pedido</h1>
      <p class="meta">Escribe el número del pedido y los últimos 4 dígitos del celular con el que compraste.</p>
      <div class="field"><label for="n">Número de pedido</label><input id="n" placeholder="KS-20261029-4821" autocomplete="off"></div>
      <div class="field"><label for="c">Últimos 4 dígitos del celular</label><input id="c" inputmode="numeric" maxlength="4" autocomplete="off"></div>
      <p class="error" id="askErr" hidden></p>
      <button class="btn" type="submit">Ver recibo</button>
    </form>
  </div>
</main>

<footer class="l-foot"><div class="in"><a href="/terminos.html">Términos</a><a href="/privacidad.html">Datos personales</a><a href="/cambios-y-devoluciones.html">Cambios y devoluciones</a><a href="/pqr.html">PQR</a></div></footer>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var N = window.NEGOCIO || {};
  var money = function (n) { return '$' + Math.round(Number(n) || 0).toLocaleString('es-CO'); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var p = new URLSearchParams(location.search);
  var numero = String(p.get('pedido') || '').toUpperCase().trim(), c = String(p.get('c') || '').replace(/\D/g, '').slice(-4);

  function ask(msg) {
    $('askForm').hidden = false; $('n').value = numero; $('c').value = c;
    if (msg) { $('askErr').textContent = msg; $('askErr').hidden = false; }
  }
  $('askForm').addEventListener('submit', function (e) {
    e.preventDefault();
    location.search = '?pedido=' + encodeURIComponent($('n').value.trim().toUpperCase()) + '&c=' + encodeURIComponent($('c').value.replace(/\D/g, ''));
  });
  if (!/^KS-\d{8}-\d{4}$/.test(numero) || !/^\d{4}$/.test(c)) { ask(); return; }

  fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ numero: numero, ultimos4: c }) })
    .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'No encontramos ese pedido.'); return d; }); })
    .then(pintar)
    .catch(function (e) { ask(e instanceof TypeError ? 'No pudimos consultar en este momento. Revisa tu conexión.' : e.message); });

  function pintar(d) {
    document.title = 'Recibo ' + d.numero + ' — kAIRO Sneakers';
    var fecha = new Date(d.createdAt).toLocaleString('es-CO', { day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    var rows = d.items.map(function (i) {
      return '<tr><td>' + esc(i.brand + ' ' + i.name) + '<br><small>Talla ' + esc(i.size) + (i.color ? ' · ' + esc(i.color) : '') + '</small><br><span class="nobox">Sin caja</span></td><td class="num">' + esc(i.qty) + '</td><td class="num">' + money(i.price) + '</td><td class="num">' + money(i.price * i.qty) + '</td></tr>';
    }).join('');
    var sub = d.items.reduce(function (s, i) { return s + i.price * i.qty; }, 0);
    var foot = '<tr><td colspan="3">Subtotal productos</td><td class="num">' + money(sub) + '</td></tr>';
    if (d.promoSavings) foot += '<tr><td colspan="3">Ahorro por promociones (ya incluido en los precios)</td><td class="num">-' + money(d.promoSavings) + '</td></tr>';
    if (d.discount) foot += '<tr><td colspan="3">Cupón ' + esc(d.couponCode) + '</td><td class="num">-' + money(d.discount) + '</td></tr>';
    if (d.envio != null) foot += '<tr><td colspan="3">Envío</td><td class="num">' + (d.envio ? money(d.envio) : 'Gratis') + '</td></tr>';
    foot += '<tr class="grand"><td colspan="3">Total</td><td class="num">' + money(d.totalConEnvio) + '</td></tr>';
    var pagoTxt = d.pago === 'Contraentrega'
      ? 'Contraentrega: anticipo de envío ' + money(d.pagarAhora) + ' por Nequi y ' + money(d.saldoContraentrega) + ' al recibir'
      : 'Nequi: ' + money(d.pagarAhora || d.totalConEnvio) + ' antes del envío';
    $('out').innerHTML =
      '<div class="tools"><button class="btn" type="button" id="print">Descargar o imprimir (PDF)</button><a class="btn btn--line" href="/seguimiento.html?pedido=' + encodeURIComponent(d.numero) + '&c=' + encodeURIComponent(c) + '">Ver seguimiento</a></div>' +
      '<article class="rc" aria-labelledby="rcTitle">' +
      '<div class="rc-top"><div><img src="/img/kairo-logo-negro.png" alt="kAIRO Sneakers" width="215" height="46">' +
      '<div class="rc-biz"><span data-negocio="responsable"></span> · NIT <span data-negocio="nit"></span><br><span data-negocio="direccion"></span>, <span data-negocio="ciudad"></span><br>WhatsApp <span data-negocio="telefonoVisible"></span> · <span data-negocio="correo"></span></div></div>' +
      '<div class="rc-no"><small id="rcTitle">Recibo de pedido</small><b>' + esc(d.numero) + '</b><br><span class="rc-st">' + esc(d.statusLabel) + '</span></div></div>' +
      '<dl class="rc-grid"><div><dt>Fecha</dt><dd>' + esc(fecha) + '</dd></div><div><dt>Cliente</dt><dd>' + esc(d.nombre) + '</dd></div>' +
      '<div><dt>Entrega</dt><dd>' + esc(d.direccion) + ', ' + esc(d.ciudad) + '</dd></div><div><dt>Forma de pago</dt><dd>' + esc(pagoTxt) + '</dd></div>' +
      (d.guia ? '<div><dt>Guía de envío</dt><dd>' + esc(d.guia) + (d.transportadora ? ' (' + esc(d.transportadora) + ')' : '') + '</dd></div>' : '') + '</dl>' +
      '<div class="table-wrap"><table><caption class="sr-only">Productos del pedido</caption><thead><tr><th scope="col">Producto</th><th scope="col" class="num">Cant.</th><th scope="col" class="num">Precio</th><th scope="col" class="num">Valor</th></tr></thead><tbody>' + rows + '</tbody><tfoot>' + foot + '</tfoot></table></div>' +
      '<p class="rc-legal"><b>Todos los productos se entregan sin caja.</b> Precios en pesos colombianos con impuestos incluidos. Tienes derecho de retracto dentro de los 5 días hábiles siguientes a la entrega y garantía legal de 1 año; consulta <a href="/cambios-y-devoluciones.html">cambios, garantía y retracto</a>. ' +
      'Este documento es un recibo del pedido y <b>no reemplaza la factura electrónica de venta</b>; si la necesitas, pídela por WhatsApp con este número.</p>' +
      '</article>';
    if (N.pintar) N.pintar();
    $('print').addEventListener('click', function () { window.print(); });
    $('contenido').focus();
  }
})();
</script>
</body>
</html>
